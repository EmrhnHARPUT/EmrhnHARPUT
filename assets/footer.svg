<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 150" width="1600" height="150" role="img" aria-label="Emirhan HARPUT">
<defs>
  <clipPath id="fc"><rect width="1600" height="150" rx="21"/></clipPath>
  <linearGradient id="fbg" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="1600" y2="0">
    <stop offset="0" stop-color="#040404"/>
    <stop offset=".5" stop-color="#0C0C0E"/>
    <stop offset="1" stop-color="#040404"/>
  </linearGradient>
  <radialGradient id="fglow" cx="50%" cy="50%" r="60%">
    <stop offset="0" stop-color="#FFFFFF" stop-opacity=".05"/>
    <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="frule" gradientUnits="userSpaceOnUse" x1="200" y1="0" x2="1400" y2="0">
    <stop offset="0" stop-color="#8A8A8E" stop-opacity="0"/>
    <stop offset=".5" stop-color="#AAA9AA" stop-opacity=".85"/>
    <stop offset="1" stop-color="#8A8A8E" stop-opacity="0"/>
  </linearGradient>
  <filter id="fgl" x="-120%" y="-400%" width="340%" height="900%">
    <feGaussianBlur stdDeviation="4"/>
  </filter>
  <style>
    @keyframes fpulse{0%,100%{opacity:.55}50%{opacity:1}}
    .fp{animation:fpulse 5s ease-in-out infinite}
    @media (prefers-reduced-motion:reduce){*{animation:none!important}}
  </style>
</defs>
<g clip-path="url(#fc)">
  <rect width="1600" height="150" fill="url(#fbg)"/>
  <rect width="1600" height="150" fill="url(#fglow)"/>

  <g fill="none" stroke="#C70202" stroke-width="2.4" opacity=".9" filter="url(#fgl)">
    <path d="M92,26 L30,26 L30,88"/>
    <path d="M1508,26 L1570,26 L1570,88"/>
    <path d="M92,124 L30,124 L30,62"/>
    <path d="M1508,124 L1570,124 L1570,62"/>
  </g>

  <line x1="200" y1="75" x2="1400" y2="75" stroke="url(#frule)" stroke-width="1.2"/>

  <line x1="200" y1="75" x2="1400" y2="75" stroke="#E11414" stroke-width="2.6"
        stroke-dasharray="150 1200" filter="url(#fgl)" opacity=".95">
    <animate attributeName="stroke-dashoffset" values="1350;0" dur="6s" repeatCount="indefinite"/>
  </line>

  <g stroke="#AAA9AA" stroke-width="1.4" opacity=".55">
    <line x1="620" y1="52" x2="620" y2="98"/>
    <line x1="980" y1="52" x2="980" y2="98"/>
  </g>

  <circle class="fp" cx="800" cy="75" r="4" fill="#C70202" filter="url(#fgl)"/>
  <circle cx="800" cy="75" r="2.2" fill="#FFFFFF"/>
</g>
</svg>
