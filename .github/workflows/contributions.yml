name: Katkı grafiğini güncelle

on:
  schedule:
    # Her 6 saatte bir (UTC). Katkı verisi bu sıklıkta fazlasıyla taze kalır.
    - cron: "17 */6 * * *"
  workflow_dispatch:        # elle de tetiklenebilir
  push:
    paths:
      - "scripts/contributions.py"
      - ".github/workflows/contributions.yml"

permissions:
  contents: write

concurrency:
  group: contributions
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Script yalnızca standart kütüphane kullanıyor — pip install yok.
      - name: Katkı verisini çek ve SVG üret
        env:
          GH_USER: ${{ github.repository_owner }}
        run: python scripts/contributions.py

      - name: Değişiklik varsa commit'le
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/contributions.svg
          if git diff --staged --quiet; then
            echo "Değişiklik yok, commit atlanıyor."
          else
            git commit -m "Katkı grafiğini güncelle [skip ci]"
            git push
          fi
