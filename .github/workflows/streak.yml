name: Seri kartını güncelle

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/streak.py"
      - ".github/workflows/streak.yml"

permissions:
  contents: write

concurrency:
  group: streak
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Katkı verisini çek ve kartı üret
        env:
          GH_USER: ${{ github.repository_owner }}
        run: python scripts/streak.py

      - name: Değişiklik varsa commit'le
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/streak.svg
          if git diff --staged --quiet; then
            echo "Kart değişmedi, commit atlanıyor."
          else
            git commit -m "Seri kartını güncelle [skip ci]"
            git push
          fi
